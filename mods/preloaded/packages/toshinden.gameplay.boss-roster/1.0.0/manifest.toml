[[feature]]
id = "boss-roster"
name = "Boss Roster"
description = "Enable the visible Gaia/Sho boss column. Up/Down switches between the regular roster and boss column, Left/Right chooses Gaia or Sho, and confirm uses the normal selection path."
group = "Gameplay"
default_enabled = false

[[plugin]]
feature = "boss-roster"
id = "toshinden.boss-roster.enable"

[[plugin]]
feature = "boss-roster"
id = "toshinden.boss-roster.ui"

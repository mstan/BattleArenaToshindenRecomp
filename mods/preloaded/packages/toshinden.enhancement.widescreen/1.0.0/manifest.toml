format_version = 5
id = "toshinden.enhancement.widescreen"
version = "1.0.0"
name = "Battle Arena Toshinden Widescreen"
author = "mstan"
description = "Renders Battle Arena Toshinden with a wider 3D viewport, adaptive aspect support, and title-specific battle HUD/backdrop handling. Adaptive follows live resize from 4:3 through the runtime-supported 32:9 limit."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94200"
exe_sha256 = "928c495ca0e9221d034085e17a79e81789738b0c389898c1d5f2384f51330f66"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Enable Battle Arena Toshinden's widescreen rendering and choose a fixed or resize-driven aspect."
group = "Display"
default_enabled = false

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
description = "Adaptive follows the live window size from 4:3 through 32:9, the current runtime maximum."
group = "Display"
type = "choice"
default = "adaptive"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "adaptive"
label = "Adaptive"

[[plugin]]
feature = "widescreen"
id = "toshinden.widescreen.16-9"
when = { aspect = "16:9" }

[[plugin]]
feature = "widescreen"
id = "toshinden.widescreen.adaptive"
when = { aspect = "adaptive" }

[[plugin]]
feature = "widescreen"
id = "toshinden.widescreen.backdrop-preserve"

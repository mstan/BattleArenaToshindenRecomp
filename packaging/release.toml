schema = 1

[product]
name = "BattleArenaToshindenRecomp"
display_name = "Battle Arena Toshinden Recompiled"
exe_name = "BattleArenaToshinden_Recompiled"
version_file = "VERSION"
game_toml = "game.toml"
player_game_toml = "packaging/release/game.toml"
runtime_target = "psx-runtime"

[build]
regenerate = true
selective_pgo = true
cmake_args = ["-DPSX_SDL_BACKEND=SDL3", "-DPSX_EXECUTION_PROFILE=ENHANCED"]
windows_cmake_args = ["-DCMAKE_EXE_LINKER_FLAGS=-Wl,--no-insert-timestamp"]

[aot]
mode = "none"

[overlay_toolchain]
ship = false

[payload]
start_here = "packaging/release/START_HERE.txt"
files = ["README.md", "RELEASE_NOTES.md", "LICENSE",
  { from = "packaging/release/input.ini", to = "input.ini" }]

[linux]
app_run = "packaging/linux/AppRun"
desktop_file = "packaging/linux/io.github.mstan.BattleArenaToshindenRecomp.desktop"
icon = "launcher_assets/img/boxart.tga"
payload_dir = "battlearenatoshindenrecomp"
env_prefix = "BAT_RECOMP"

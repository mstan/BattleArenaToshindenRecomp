name: Release builds
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.1.0 or v0.1.0). Leave empty to auto-bump from the latest vX.Y.Z git
          tag (see bump).
        required: false
        type: string
        default: ''
      bump:
        description: When version is empty, which semver component to increment
        required: false
        type: choice
        options:
        - patch
        - minor
        - major
        default: patch
      publish:
        description: Create git tag vX.Y.Z and GitHub Release
        required: true
        type: boolean
        default: true
      reuse_cached_emitters:
        description: Skip emitter rebuild when build-recompiler cache hits (psxrecomp SHA)
        required: false
        type: boolean
        default: true
      channel:
        description: Release channel
        type: choice
        required: true
        options:
        - public
        - playtest
        default: public
concurrency:
  group: bat-release-${{ github.event_name }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  release:
    uses: RetroPortingToolKit/psxrecomp/.github/workflows/title-release.yml@5d0378040e97ed583f5569295a720247e4101d7a
    with:
      provider-ref: 5d0378040e97ed583f5569295a720247e4101d7a
      title: Battle Arena Toshinden Recompiled
      zip-prefix: bat
      platforms: '[{"os":"ubuntu-24.04","artifact":"linux-x64","shell":"bash"},{"os":"windows-2022","artifact":"windows-x64","shell":"msys2
        {0}"},{"os":"macos-15","artifact":"macos-arm64","shell":"bash","deployment_target":"11.0"},{"os":"macos-15-intel","artifact":"macos-x64","shell":"bash","deployment_target":"11.0"}]'
      package-kind: setup
      package-script: scripts/package_setup_release.sh
      extra-cmake-args: ''
      require-retail-backend: false
      lint-boot-exe: true
      portable-linux: false
      version: ${{ inputs.version }}
      bump: ${{ inputs.bump }}
      publish: ${{ inputs.publish }}
      channel: ${{ inputs.channel }}
      reuse-cached-emitters: ${{ inputs.reuse_cached_emitters }}
